# Blocul de nginx pentru facturare.fullstackit.ro.
#
# Serverul nu ruleaza Traefik. Porturile 80 si 443 sunt tinute de containerul
# `fsi-web` (nginx:alpine), care ruteaza toate subdomeniile dupa Host. Vhost-urile
# lui vin din `/opt/fullstackit/docker/nginx/apps.conf`, montat de pe gazda, iar
# certificatele din `/etc/letsencrypt`, montat read-only.
#
# INSTALARE
#   1. Copiaza blocul de mai jos in /opt/fullstackit/docker/nginx/apps.conf
#      (sau intr-un fisier propriu, daca preferi, si monteaza-l la fel).
#   2. Compara-l cu blocul unui subdomeniu care merge deja — de exemplu
#      hub.fullstackit.ro. Daca acolo certificatul e un wildcard pentru
#      *.fullstackit.ro, pastreaza calea aia si sari peste pasul 3.
#   3. Emite certificatul, DE PE GAZDA, inainte de a incarca blocul 443:
#        certbot certonly --webroot -w /var/www/html \
#          -d facturare.fullstackit.ro
#      Cloudflare e pe Proxied, deci provocarea HTTP trece prin el. Daca nu
#      trece, comuta record-ul `facturare` pe DNS only in Cloudflare, emite,
#      apoi pune-l inapoi pe Proxied.
#   4. docker exec fsi-web nginx -t && docker exec fsi-web nginx -s reload
#
# `facturare-api` e numele fix al containerului din docker-compose.prod.yml.
# Rezolutia merge pentru ca ambele containere stau pe reteaua `apps-net`.

server {
    listen 80;
    listen [::]:80;
    server_name facturare.fullstackit.ro;

    # Provocarea ACME ramane pe 80; restul urca pe TLS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name facturare.fullstackit.ro;

    ssl_certificate     /etc/letsencrypt/live/facturare.fullstackit.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/facturare.fullstackit.ro/privkey.pem;

    # XML-ul de factura urca pana la 10 MB la ANAF, iar arhivele lunare sunt mai
    # mari. Valoarea implicita de 1 MB ar taia exact ce e de trimis.
    client_max_body_size 25m;

    location / {
        proxy_pass http://facturare-api:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Fara asta, redirectul catre ANAF s-ar construi pe http si ar iesi din
        # potrivirea exacta ceruta pentru Callback URL.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Apelurile catre SPV pot sta; randarea PDF e in worker, nu aici, dar
        # descarcarea arhivei trece prin API.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Verificarea de sanatate nu are ce cauta in loguri la fiecare 30 de secunde.
    location = /health {
        proxy_pass http://facturare-api:8000/health;
        access_log off;
    }
}
